      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Criar transação
      tags:
      - transactions
  /transactions/list:
    get:
      consumes:
      - application/json
      description: Retorna a lista de transações, com filtros opcionais por tipo,
        categoria, área e período.
      parameters:
      - description: Filtro por tipo (income ou expense)
        enum:
        - income
        - expense
        in: query
        name: type
        type: string
      - description: Filtro por ID da categoria
        in: query
        name: category_id
        type: integer
      - description: Filtro por ID da área
        in: query
        name: area_id
        type: integer
      - description: Data inicial (AAAA-MM-DD)
        format: "2006-01-02"
        in: query
        name: from
        type: string
      - description: Data final (AAAA-MM-DD)
        format: "2006-01-02"
        in: query
        name: to
        type: string
      produces:
      - application/json
