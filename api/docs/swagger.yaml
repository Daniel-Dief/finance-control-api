      parameters:
      - description: ID do orçamento
        in: path
        name: id
        required: true
        type: integer
      - description: Campos a atualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.BudgetUpdateBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
