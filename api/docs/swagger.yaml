          schema:
            additionalProperties:
              type: string
            type: object
      summary: Atualizar orçamento
      tags:
      - budgets
  /budgets/create:
    post:
      consumes:
      - application/json
      description: Cria um novo orçamento a partir dos dados informados no corpo da
        requisição.
      parameters:
      - description: Dados do novo orçamento
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.BudgetBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Budget'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Criar orçamento
      tags:
      - budgets
  /budgets/list:
    get:
      consumes:
      - application/json
      description: Retorna a lista de orçamentos, com filtros opcionais por ano, mês
        e área.
      parameters:
      - description: Filtro por ano
        in: query
        name: year
        type: integer
      - description: Filtro por mês (1-12)
        in: query
        name: month
        type: integer
      - description: Filtro por ID da área
        in: query
        name: area_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Budget'
            type: array
        "204":
          description: No Content
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar orçamentos
      tags:
      - budgets
