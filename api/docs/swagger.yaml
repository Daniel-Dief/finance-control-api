  /transactions/create:
    post:
      consumes:
      - application/json
      description: Cria uma nova transação (receita ou despesa) a partir dos dados
        informados.
      parameters:
      - description: Dados da nova transação
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.TransactionBody'
