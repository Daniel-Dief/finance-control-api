basePath: /
definitions:
  models.Area:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.Budget:
    properties:
      amount:
        type: integer
      area_id:
        type: integer
      id:
        type: integer
      month:
        type: integer
      year:
        type: integer
    type: object
  models.Category:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.Transaction:
    properties:
      amount:
        type: integer
      area_id:
        type: integer
      category_id:
        type: integer
      date:
        type: string
      id:
        type: integer
      type:
        description: '''income'' or ''expense'''
        type: string
    type: object
  routes.AreaBody:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  routes.BudgetBody:
    properties:
      amount:
        type: integer
      area_id:
        type: integer
      month:
        maximum: 12
        minimum: 1
        type: integer
      year:
        minimum: 1
        type: integer
    required:
    - area_id
    - month
    - year
    type: object
  routes.BudgetUpdateBody:
    properties:
      amount:
        type: integer
      area_id:
        type: integer
      month:
        maximum: 12
        minimum: 1
        type: integer
      year:
        minimum: 1
        type: integer
    type: object
  routes.CategoryBody:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  routes.TransactionBody:
    properties:
      amount:
        type: integer
      area_id:
        type: integer
      category_id:
        type: integer
      date:
        type: string
      type:
        enum:
        - income
        - expense
        type: string
    required:
    - amount
    - area_id
    - category_id
    - date
    - type
    type: object
  routes.TransactionUpdateBody:
    properties:
      amount:
        type: integer
      area_id:
        type: integer
      category_id:
        type: integer
      date:
        type: string
      type:
        enum:
        - income
        - expense
        type: string
    type: object
host: localhost:1323
info:
  contact: {}
  description: API para gerenciamento financeiro pessoal — áreas, categorias, orçamentos
    e transações.
  title: Finance Control API
  version: "1.0"
paths:
  /areas/{id}:
    delete:
      consumes:
      - application/json
      description: Remove uma área a partir do seu identificador.
      parameters:
      - description: ID da área
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Excluir área
      tags:
      - areas
    get:
      consumes:
      - application/json
      description: Retorna os dados de uma área a partir do seu identificador.
      parameters:
      - description: ID da área
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Area'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obter área por ID
      tags:
      - areas
    put:
      consumes:
      - application/json
      description: Atualiza o nome de uma área existente identificada pelo ID.
      parameters:
      - description: ID da área
        in: path
        name: id
        required: true
        type: integer
      - description: Novos dados da área
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.AreaBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Area'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Atualizar área
      tags:
      - areas
  /areas/create:
    post:
      consumes:
      - application/json
      description: Cria uma nova área a partir do nome informado no corpo da requisição.
      parameters:
      - description: Dados da nova área
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.AreaBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Area'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Criar área
      tags:
      - areas
  /areas/list:
    get:
      consumes:
      - application/json
      description: Retorna a lista de todas as áreas cadastradas, com filtro opcional
        por nome.
      parameters:
      - description: Filtro por nome da área
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Area'
            type: array
        "204":
          description: No Content
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar áreas
      tags:
      - areas
